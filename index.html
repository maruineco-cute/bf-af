<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17161d"><title>ビフォーアフターメーカー</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;background:#17161d;color:#f3f0f1}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% -5%,#373039 0%,#17161d 47%);-webkit-tap-highlight-color:transparent}main{width:min(100%,540px);margin:auto;padding:28px 18px calc(28px + env(safe-area-inset-bottom))}.header{margin-bottom:21px}.header h1{font-weight:700;letter-spacing:.04em;font-size:27px;margin:0 0 6px}.header p{color:#b5abb1;font-size:13px;margin:0;line-height:1.6}.uploads{display:grid;grid-template-columns:1fr 1fr;gap:9px}.upload{position:relative;display:flex;align-items:center;gap:10px;border:1px solid #494049;background:#28242c;border-radius:12px;padding:12px 11px;min-width:0;cursor:pointer}.upload:active{background:#373039}.upload input{position:absolute;width:1px;height:1px;opacity:0}.upload:focus-within{outline:2px solid #d3a8b0}.icon{height:34px;width:34px;flex:none;border-radius:9px;background:#41343c;color:#eac4ca;display:grid;place-items:center;font-size:20px}.upload strong{display:block;font-size:12px}.upload small{display:block;color:#aaa0a7;font-size:10px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}.adjust-open{width:100%;margin-top:9px;border:1px solid #5a4b54;background:#302a32;color:#e1d3d8;border-radius:10px;padding:11px;font-size:12px;cursor:pointer}.adjust-open:disabled{opacity:.4}.adjust-panel{margin-top:9px;padding:12px;background:#302a32;border:1px solid #594b53;border-radius:12px}.adjust-panel[hidden]{display:none}.adjust-tabs{display:flex;gap:7px}.adjust-tabs button{flex:1;background:#252129;color:#c6bac1;border:1px solid #5a4b54;border-radius:8px;padding:10px 5px;font-size:12px}.adjust-tabs button.active{background:#e5c2c8;border-color:#e5c2c8;color:#30232b;font-weight:700}.adjust-panel p{font-size:11px;color:#c5b8bf;line-height:1.6;margin:10px 0 6px}.adjust-reset{background:none;border:0;color:#e6bec6;padding:5px 0;font-size:11px;text-decoration:underline}.mode-label{display:flex;justify-content:space-between;align-items:center;margin:22px 0 9px;font-size:11px;letter-spacing:.1em;color:#bfb5bb}.mode-label span:last-child{letter-spacing:0;color:#8b8189}.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.mode{border:1px solid #484148;background:#29262d;color:#c2b9bf;padding:12px 2px;border-radius:10px;font-size:12px;white-space:nowrap;cursor:pointer}.mode.active{background:#e5c2c8;color:#30232b;border-color:#e5c2c8;font-weight:700}.light-options{display:flex;align-items:center;gap:6px;margin-top:12px;color:#aaa0a8;font-size:11px}.light-options button{border:1px solid #51454d;border-radius:8px;background:#29262d;color:#c3b9be;padding:8px 12px;font-size:11px}.light-options button.active{border-color:#d6aeb7;color:#f3d8dd;background:#49353e}.stage{margin-top:16px;border-radius:14px;overflow:hidden;background:#242129;border:1px solid #4a4149;position:relative;min-height:280px;display:grid;place-items:center;box-shadow:0 18px 40px #0003}canvas{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;pointer-events:none;text-align:center;padding:20px;color:#aaa0a8;font-size:12px;line-height:1.8}.placeholder .plus{width:48px;height:48px;border:1px solid #66515b;border-radius:50%;display:grid;place-items:center;color:#d3aab3;font-size:25px}.hint{font-size:11px;color:#aaa0a8;line-height:1.7;margin:11px 2px 0}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.status{font-size:11px;color:#8e858c}.reset{background:transparent;color:#d7c6ca;border:1px solid #5a4b54;border-radius:9px;padding:9px 14px;font-size:12px;cursor:pointer}.reset:disabled{opacity:.4}.note{border-top:1px solid #393239;margin-top:23px;padding-top:15px;color:#958b92;font-size:11px;line-height:1.8}button{font-family:inherit}button:focus-visible{outline:2px solid #e7bdc5;outline-offset:3px}
</style>
</head><body><main>
<header class="header"><h1>ビフォーアフターメーカー</h1><p>2枚の写真や絵を重ねて、変化を楽しく見せよう！</p></header>
<section class="uploads" aria-label="画像を選ぶ"><label class="upload"><span class="icon">＋</span><span><strong>ビフォー（上）</strong><small id="topName">画像を選ぶ</small></span><input id="topFile" type="file" accept="image/*"></label><label class="upload"><span class="icon">＋</span><span><strong>アフター（下）</strong><small id="bottomName">画像を選ぶ</small></span><input id="bottomFile" type="file" accept="image/*"></label></section>
<button class="adjust-open" id="adjustToggle" disabled>位置・サイズを調整</button>
<div class="adjust-panel" id="adjustPanel" hidden><div class="adjust-tabs"><button id="adjustTop" class="active" aria-pressed="true">ビフォーを調整</button><button id="adjustBottom" aria-pressed="false">アフターを調整</button></div><p>指1本で移動、2本で拡大・縮小。2枚を半透明に重ねて表示します。</p><button class="adjust-reset" id="adjustReset">選択中の画像を元の位置に戻す</button></div>
<div class="mode-label"><span>見せ方</span><span>タップして選択</span></div>
<div class="modes"><button class="mode active" id="lightBtn" aria-pressed="true">光</button><button class="mode" id="blockBtn" aria-pressed="false">ブロック</button><button class="mode" id="paintBtn" aria-pressed="false">ペンキ</button><button class="mode" id="crackBtn" aria-pressed="false">パキパキ</button><button class="mode" id="zipperBtn" aria-pressed="false">ファスナー</button><button class="mode" id="waterBtn" aria-pressed="false">水滴</button><button class="mode" id="paperBtn" aria-pressed="false">🦋 蝶々</button><button class="mode reset" id="reset" disabled>元に戻す ↺</button></div>
<div class="light-options" id="lightOptions"><span>光の残り方　</span><button class="active" id="fadeBtn" aria-pressed="true">少し残る</button><button id="keepBtn" aria-pressed="false">残したまま</button></div>
<div class="stage"><canvas id="canvas" width="720" height="900" aria-label="ビフォーからアフターへのプレビュー"></canvas><div class="placeholder" id="placeholder"><div class="plus">＋</div><div>ビフォーとアフターを選んで<br>ここをなぞってみよう</div></div></div>
<p class="hint" id="hint">指の少し上に光が出ます。照らした場所は少しずつ消えます。</p><div class="footer"><span class="status" id="status">画像を2枚選んでください</span></div>
<p class="note">線画→完成、子猫→大猫などに。<br>画像はこの端末の中だけで扱います。同じ構図・比率の画像を使うと、きれいに重なります。</p>
</main><script>
const W=720,PAINT_R=46;
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');
const off=document.createElement('canvas'),oc=off.getContext('2d');
const lightLayer=document.createElement('canvas'),lc=lightLayer.getContext('2d');
const mask=document.createElement('canvas'),mc=mask.getContext('2d');
const $=s=>document.querySelector(s);
const topFile=$('#topFile'),bottomFile=$('#bottomFile'),placeholder=$('#placeholder'),status=$('#status'),reset=$('#reset'),hint=$('#hint'),lightOptions=$('#lightOptions');
let topImg=null,bottomImg=null,mode='light',lightStyle='fade',pointer=null,tiles=[],lastBurst=null;
let lightOn=false,lastStamp=0,paints=[],drips=[],sets=[],shake=0,running=false,lastNow=0;
let drops=[],tears=[],lastTear=null,zippers=[],activeZip=null,particles=[];
let editing=false,editTarget='top',adjustments={top:{x:0,y:0,scale:1},bottom:{x:0,y:0,scale:1}},touches=new Map(),gesture=null;
const MODES=['light','block','paint','crack','zipper','water','paper'];

function ready(){return !!(topImg&&bottomImg)}
function contain(c,img,w,h,adjust={x:0,y:0,scale:1}){const s=Math.min(w/img.naturalWidth,h/img.naturalHeight)*adjust.scale,iw=img.naturalWidth*s,ih=img.naturalHeight*s;c.drawImage(img,(w-iw)/2+adjust.x,(h-ih)/2+adjust.y,iw,ih)}
function makeTiles(h){const t=[];for(let y=0;y<h;){const rowHeight=Math.min(34+Math.floor(Math.random()*62),h-y);for(let x=0;x<W;){const blockWidth=Math.min(34+Math.floor(Math.random()*78),W-x);t.push({x,y,w:blockWidth,h:rowHeight,fall:false,done:false,dx:0,dy:0,vx:0,vy:0,angle:0,spin:0,alpha:1});x+=blockWidth}y+=rowHeight}return t}
function rebuild(){
  if(topImg){
    const h=Math.round(Math.max(540,Math.min(1080,W*topImg.naturalHeight/topImg.naturalWidth)));
    for(const c of [canvas,off,lightLayer,mask]){c.width=W;c.height=h}
    oc.clearRect(0,0,W,h);contain(oc,topImg,W,h,adjustments.top);
    tiles=makeTiles(h);
  }
  paints=[];drips=[];sets=[];drops=[];tears=[];particles=[];lastTear=null;zippers=[];activeZip=null;shake=0;lightOn=false;pointer=null;lastBurst=null;
  draw(performance.now());
}
function draw(now){
  const h=canvas.height;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#242129';ctx.fillRect(0,0,W,h);
  if(editing&&ready()){ctx.save();contain(ctx,bottomImg,W,h,adjustments.bottom);ctx.globalAlpha=.5;contain(ctx,topImg,W,h,adjustments.top);ctx.restore();return}
  ctx.save();
  if(shake>0.3)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  if(bottomImg)contain(ctx,bottomImg,W,h,adjustments.bottom);
  if(topImg){
    if(mode==='block'){
      for(const b of tiles){if(b.done)continue;ctx.save();ctx.globalAlpha=b.alpha;ctx.translate(b.x+b.w/2+b.dx,b.y+b.h/2+b.dy);ctx.rotate(b.angle);ctx.drawImage(off,b.x,b.y,b.w,b.h,-b.w/2,-b.h/2,b.w,b.h);ctx.restore()}
    }else{
      lc.globalCompositeOperation='source-over';lc.clearRect(0,0,W,h);lc.drawImage(off,0,0);
      lc.globalCompositeOperation='destination-out';lc.drawImage(mask,0,0);lc.globalCompositeOperation='source-over';
      ctx.drawImage(lightLayer,0,0);
      if(mode==='crack'){drawCracks(now);drawShards(now)}
      if(mode==='water')drawRipples(now);
      if(mode==='zipper')drawZipper();
    }
  }
  ctx.restore();
}
function strokePts(pts,dy,color,lw){ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y+dy);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y+dy);ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.stroke()}
function drawCracks(now){
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const s of sets){
    const fade=Math.max(0,1-Math.max(0,now-s.t0-350)/300);
    if(fade<=0)continue;
    ctx.save();ctx.globalAlpha=fade*.78;
    const p=Math.min(1,(now-s.t0)/130);
    for(const line of s.lines){
      const k=Math.max(2,Math.ceil(p*line.length));
      const pts=line.slice(0,k);
      strokePts(pts,1.2,'rgba(0,0,0,.45)',3.2);
      strokePts(pts,0,'rgba(255,255,255,.9)',1.8);
    }
    ctx.restore();
  }
}
function fillPoly(c,poly){c.globalCompositeOperation='source-over';c.fillStyle='#000';c.strokeStyle='#000';c.lineWidth=2;c.lineJoin='round';c.beginPath();c.moveTo(poly[0].x,poly[0].y);for(let i=1;i<poly.length;i++)c.lineTo(poly[i].x,poly[i].y);c.closePath();c.fill();c.stroke()}
function drawRipples(now){
  for(const d of drops){const p=Math.min(1,(now-d.t0)/1100);ctx.save();ctx.globalAlpha=(1-p)*.65;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(d.x,d.y,d.r*(.25+p*.8),0,Math.PI*2);ctx.stroke();ctx.restore()}
}
function butterflyAt(p){
  if(lastTear&&Math.hypot(p.x-lastTear.x,p.y-lastTear.y)<lastTear.spacing)return;
  const size=Math.random()<.5?1:2;
  lastTear={x:p.x,y:p.y,spacing:size===2?125:78};
  mc.save();mc.globalCompositeOperation='source-over';mc.fillStyle='#000';mc.strokeStyle='#000';mc.translate(p.x,p.y);mc.rotate((Math.random()-.5)*.45);mc.scale(size,size);
  // 左右の前翅と、尾のついた後翅を別々に描く。
  for(const side of [-1,1]){
    mc.save();mc.scale(side,1);
    mc.beginPath();mc.moveTo(2,-3);
    mc.bezierCurveTo(9,-14,20,-30,34,-35);
    mc.bezierCurveTo(41,-37,43,-32,42,-27);
    mc.bezierCurveTo(41,-18,37,-10,31,-6);
    mc.bezierCurveTo(35,-3,31,2,26,3);
    mc.bezierCurveTo(21,6,14,5,3,3);mc.closePath();mc.fill();
    mc.beginPath();mc.moveTo(3,1);
    mc.bezierCurveTo(13,-1,25,1,29,6);
    mc.bezierCurveTo(32,9,30,12,28,14);
    mc.bezierCurveTo(30,17,27,20,24,21);
    mc.lineTo(24,29);mc.lineTo(18,24);
    mc.bezierCurveTo(16,27,12,25,10,23);
    mc.bezierCurveTo(7,23,4,17,2,9);mc.closePath();mc.fill();
    mc.restore();
  }
  mc.beginPath();mc.ellipse(0,0,3.6,16,0,0,Math.PI*2);mc.fill();
  mc.restore();
}
// 最初の中央を開くファスナーに戻す。
function startZip(p){if(!zippers.length)zippers=[{end:0}];activeZip=zippers[0]}
function updateZip(p){
  if(!activeZip)return;
  const h=canvas.height;activeZip.end=Math.max(activeZip.end,Math.max(0,Math.min(h,p.y)));
  const end=activeZip.end;mc.clearRect(0,0,W,h);
  if(end>=h*.94){mc.fillStyle='#000';mc.fillRect(0,0,W,h);activeZip.end=h;return}
  const spread=(W/2)*Math.min(1,end/(h*.7));
  if(end>0)fillPoly(mc,[{x:W/2-spread,y:0},{x:W/2+spread,y:0},{x:W/2,y:end}]);
}
function drawZipper(){
  const end=zippers.length?zippers[0].end:0,h=canvas.height,x=W/2;if(end>=h)return;
  const spread=(W/2)*Math.min(1,end/(h*.7));ctx.save();ctx.lineWidth=5;ctx.strokeStyle='rgba(25,21,25,.7)';ctx.beginPath();ctx.moveTo(x-spread,0);ctx.lineTo(x,end);ctx.lineTo(x+spread,0);ctx.stroke();
  ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.setLineDash([7,7]);ctx.beginPath();ctx.moveTo(x-spread,0);ctx.lineTo(x,end);ctx.lineTo(x+spread,0);ctx.moveTo(x,end);ctx.lineTo(x,h);ctx.stroke();ctx.setLineDash([]);
  const y=Math.max(24,end);ctx.fillStyle='#f1e4e4';ctx.strokeStyle='#564750';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x-15,y-12,30,44,9);ctx.fill();ctx.stroke();ctx.strokeStyle='#75646a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y+9,6,0,Math.PI*2);ctx.stroke();ctx.restore();
}
function lightStamp(p,now){
  lastStamp=now;lightOn=true;
  const x=p.x,y=Math.max(65,p.y-140),r=100;
  const g=mc.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.65,'rgba(0,0,0,1)');g.addColorStop(.92,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');
  mc.globalCompositeOperation='source-over';mc.fillStyle=g;mc.fillRect(x-r,y-r,r*2,r*2);
}
function makeDrip(x,y){return{x,y,end:Math.min(canvas.height,y+60+Math.random()*190),v:1.8+Math.random()*1.2,w:9+Math.random()*8}}
function crackPath(o,a,L,segs,jit){
  const pts=[];
  for(let s=1;s<=segs;s++){
    const r=L*s/segs,j=s<segs?(Math.random()-.5)*jit:0;
    pts.push({x:o.x+Math.cos(a)*r-Math.sin(a)*j,y:o.y+Math.sin(a)*r+Math.cos(a)*j});
  }
  return pts;
}
function burst(p,now){
  const n=4+Math.floor(Math.random()*3),base=65+Math.random()*60,a0=Math.random()*Math.PI*2;
  const rays=[];
  for(let i=0;i<n;i++){
    const a=a0+(i+(Math.random()-.5)*.55)*Math.PI*2/n;
    const L=base*(.7+Math.random()*.6);
    rays.push({a,L,pts:crackPath(p,a,L,5,16)});
  }
  const lines=[];
  for(const r of rays)lines.push([{x:p.x,y:p.y},...r.pts]);
  for(const r of rays){
    const b=r.pts[2],ba=r.a+(Math.random()<.5?-1:1)*(.5+Math.random()*.4);
    lines.push([{x:b.x,y:b.y},...crackPath(b,ba,r.L*.38,2,8)]);
  }
  // 尖った大小の破片。小さい破片はたまに混ぜる。
  const chips=[];
  for(let i=0;i<n;i++){
    const r1=rays[i],r2=rays[(i+1)%n];
    if(Math.random()<.2&&i>0)continue;
    const poly=[{x:p.x,y:p.y},...r1.pts,...r2.pts.slice().reverse()];
    chips.push({poly,at:now+100+Math.random()*240,done:false});
    if(Math.random()<.18){
      const edge=r1.pts[4],mid=r1.pts[3],v=r2.pts[4];
      const tiny=[{x:edge.x,y:edge.y},{x:mid.x,y:mid.y},{x:edge.x+(v.x-edge.x)*.13,y:edge.y+(v.y-edge.y)*.13}];
      chips.push({poly:tiny,at:now+120+Math.random()*260,done:false});
    }
  }
  sets.push({t0:now,lines,chips});
  shake=Math.max(shake,2);
}
function makeShard(poly,now){
  const cx=poly.reduce((sum,p)=>sum+p.x,0)/poly.length,cy=poly.reduce((sum,p)=>sum+p.y,0)/poly.length;
  particles.push({poly,cx,cy,vx:(Math.random()-.5)*60,vy:-20-Math.random()*30,spin:(Math.random()-.5)*2,t0:now,life:450+Math.random()*250});
}
function drawShards(now){
  for(const p of particles){const t=(now-p.t0)/1000,alpha=Math.max(0,1-(now-p.t0)/p.life);ctx.save();ctx.globalAlpha=alpha;ctx.translate(p.cx+p.vx*t,p.cy+p.vy*t+240*t*t);ctx.rotate(p.spin*t);ctx.translate(-p.cx,-p.cy);ctx.beginPath();ctx.moveTo(p.poly[0].x,p.poly[0].y);for(let i=1;i<p.poly.length;i++)ctx.lineTo(p.poly[i].x,p.poly[i].y);ctx.closePath();ctx.clip();ctx.drawImage(off,0,0);ctx.restore()}
}
function breakAt(p){
  for(const b of tiles){
    if(b.fall||b.done)continue;
    const cx=b.x+b.w/2,cy=b.y+b.h/2;
    if(Math.hypot(cx-p.x,cy-p.y)<82){b.fall=true;b.vx=(Math.random()-.5)*4;b.vy=-2-Math.random()*3;b.spin=(Math.random()-.5)*.07}
  }
}
function act(p){
  const now=performance.now();
  if(mode==='light')lightStamp(p,now);
  else if(mode==='block')breakAt(p);
  else if(mode==='paint'){
    paints.push({x:p.x,y:p.y,t0:now});
    if(Math.random()<.45)drips.push(makeDrip(p.x,p.y+PAINT_R*.55));
  }else if(mode==='water'){
    if(!lastBurst||Math.hypot(p.x-lastBurst.x,p.y-lastBurst.y)>90){drops.push({x:p.x,y:p.y,t0:now,r:90+Math.random()*65});lastBurst={x:p.x,y:p.y}}
  }else if(mode==='paper'){butterflyAt(p);
  }else if(mode==='zipper'){updateZip(p);
  }else if(mode==='crack'){
    if(!lastBurst||Math.hypot(p.x-lastBurst.x,p.y-lastBurst.y)>70){burst(p,now);lastBurst={x:p.x,y:p.y}}
  }
  kick();
}
function kick(){if(!running){running=true;lastNow=0;requestAnimationFrame(tick)}}
function tick(now){
  const dt=lastNow?Math.min(now-lastNow,64):16;lastNow=now;
  const f=dt/16;
  // 光（少し残る）
  if(mode==='light'&&lightStyle==='fade'&&lightOn){
    mc.globalCompositeOperation='destination-out';mc.fillStyle=`rgba(0,0,0,${1-Math.exp(-dt/700)})`;mc.fillRect(0,0,W,canvas.height);mc.globalCompositeOperation='source-over';
    if(pointer)lightStamp(pointer,now);
    else if(now-lastStamp>5000){mc.clearRect(0,0,W,canvas.height);lightOn=false}
  }
  // たらーっ：なぞったところがじわっと広がる
  for(const s of paints){
    const p=Math.min(1,(now-s.t0)/320),e=1-Math.pow(1-p,3);
    mc.globalCompositeOperation='source-over';mc.fillStyle='#000';mc.beginPath();mc.arc(s.x,s.y,PAINT_R*e,0,Math.PI*2);mc.fill();
  }
  paints=paints.filter(s=>now-s.t0<320);
  // たらーっ：垂れていく
  for(const d of drips){
    const ny=Math.min(d.end,d.y+d.v*f);
    mc.globalCompositeOperation='source-over';mc.strokeStyle='#000';mc.fillStyle='#000';mc.lineCap='round';
    mc.lineWidth=d.w;mc.beginPath();mc.moveTo(d.x,d.y);mc.lineTo(d.x,ny);mc.stroke();
    mc.beginPath();mc.arc(d.x,ny,d.w*.62,0,Math.PI*2);mc.fill();
    d.y=ny;d.v=Math.max(.35,d.v*Math.pow(.993,f));
